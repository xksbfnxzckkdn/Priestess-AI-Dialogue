<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRIESTESS // PRTS TERMINAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--c:#00d4ff;--p:#b794f6;--d:#0a0a0f;--bg:rgba(10,15,30,0.85);--g:rgba(0,212,255,0.3);--t:#e2e8f0;--m:#64748b}
body{background:var(--d);color:var(--t);font-family:'Noto Serif SC',serif;overflow:hidden;height:100vh}
#starfield{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scanlines{position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,0.03) 2px,rgba(0,212,255,0.03) 4px);pointer-events:none;z-index:1000;animation:sM 8s linear infinite}
@keyframes sM{to{transform:translateY(4px)}}
.main-container{position:relative;z-index:10;display:flex;height:100vh;padding:16px;gap:16px}
.character-panel{width:340px;min-width:340px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.character-frame{position:relative;width:100%;height:560px;border:1px solid rgba(0,212,255,0.2);background:var(--bg);backdrop-filter:blur(10px);overflow:hidden}
.character-frame::before,.character-frame::after{content:'';position:absolute;width:24px;height:24px;border:2px solid var(--c)}
.character-frame::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.character-frame::after{bottom:-1px;right:-1px;border-left:none;border-top:none}
.character-img{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 30px rgba(0,212,255,0.2));animation:br 4s ease-in-out infinite;transition:opacity .3s}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.char-hud{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(to top,rgba(10,15,30,0.95),transparent)}
.char-name{font-family:'Share Tech Mono',monospace;font-size:22px;color:var(--c);text-shadow:0 0 10px var(--g);letter-spacing:3px}
.char-title{font-size:11px;color:var(--m);margin-top:4px;letter-spacing:2px}
.status-indicator{display:inline-block;width:8px;height:8px;background:#00ff88;border-radius:50%;margin-right:8px;animation:pu 2s ease-in-out infinite;box-shadow:0 0 8px #00ff88}
@keyframes pu{50%{opacity:.4}}
.terminal-panel{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.system-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:var(--bg);border:1px solid rgba(0,212,255,0.15);backdrop-filter:blur(10px);font-family:'Share Tech Mono',monospace;font-size:11px}
.system-bar .left,.system-bar .right{display:flex;gap:16px;align-items:center}
.sys-label{color:var(--m);text-transform:uppercase;letter-spacing:2px}
.sys-value{color:var(--c);text-shadow:0 0 5px var(--g)}
.settings-btn{background:none;border:1px solid rgba(0,212,255,0.3);color:var(--c);padding:5px 10px;font-family:'Share Tech Mono',monospace;font-size:10px;cursor:pointer;transition:all .3s;letter-spacing:1px}
.settings-btn:hover{background:rgba(0,212,255,0.1);box-shadow:0 0 10px rgba(0,212,255,0.2)}
.chat-area{flex:1;background:var(--bg);border:1px solid rgba(0,212,255,0.15);backdrop-filter:blur(10px);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:var(--c);border-radius:2px}
.message{max-width:80%;padding:12px 16px;animation:mI .4s ease-out}
@keyframes mI{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message.user{align-self:flex-end;background:rgba(0,212,255,0.08);border-left:3px solid var(--c)}
.message.priestess{align-self:flex-start;background:rgba(183,148,246,0.08);border-right:3px solid var(--p)}
.message-header{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--m);margin-bottom:6px;letter-spacing:2px;text-transform:uppercase}
.message-content{font-size:14px;line-height:1.8;color:var(--t)}
.message-content .action{color:var(--p);font-style:italic;opacity:.85;display:block;margin-bottom:6px;font-size:12px}
.input-area{display:flex;gap:10px;padding:14px 18px;background:var(--bg);border:1px solid rgba(0,212,255,0.15);backdrop-filter:blur(10px)}
.input-area input{flex:1;background:rgba(0,0,0,0.3);border:1px solid rgba(0,212,255,0.2);color:var(--t);padding:10px 14px;font-family:'Noto Serif SC',serif;font-size:14px;outline:none;transition:all .3s}
.input-area input:focus{border-color:var(--c);box-shadow:0 0 15px rgba(0,212,255,0.1)}
.input-area input::placeholder{color:var(--m)}
.send-btn{padding:10px 24px;background:transparent;border:1px solid var(--c);color:var(--c);font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;cursor:pointer;transition:all .3s;text-transform:uppercase}
.send-btn:hover{background:rgba(0,212,255,0.1);box-shadow:0 0 20px rgba(0,212,255,0.2)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.typing-cursor{display:inline-block;width:2px;height:1em;background:var(--c);margin-left:2px;animation:bl 1s step-end infinite;vertical-align:middle}
@keyframes bl{50%{opacity:0}}
.settings-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1999;opacity:0;pointer-events:none;transition:opacity .3s}
.settings-overlay.active{opacity:1;pointer-events:all}
.settings-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.95);width:420px;max-width:90vw;background:rgba(10,15,30,0.95);border:1px solid rgba(0,212,255,0.3);backdrop-filter:blur(20px);padding:24px;z-index:2000;opacity:0;pointer-events:none;transition:all .3s ease}
.settings-panel.active{opacity:1;pointer-events:all;transform:translate(-50%,-50%) scale(1)}
.settings-panel::before,.settings-panel::after{content:'';position:absolute;width:18px;height:18px;border:2px solid var(--c)}
.settings-panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.settings-panel::after{bottom:-1px;right:-1px;border-left:none;border-top:none}
.settings-title{font-family:'Share Tech Mono',monospace;color:var(--c);font-size:14px;letter-spacing:3px;margin-bottom:20px;text-align:center;text-shadow:0 0 10px var(--g)}
.setting-row{margin-bottom:14px}
.setting-label{display:block;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--m);letter-spacing:2px;margin-bottom:5px;text-transform:uppercase}
.setting-input{width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(0,212,255,0.2);color:var(--t);padding:9px 11px;font-family:'Share Tech Mono',monospace;font-size:11px;outline:none;transition:all .3s}
.setting-input:focus{border-color:var(--c);box-shadow:0 0 10px rgba(0,212,255,0.1)}
.setting-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.toggle-switch{width:36px;height:18px;background:rgba(0,212,255,0.1);border:1
