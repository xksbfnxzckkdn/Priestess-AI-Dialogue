<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>普瑞赛斯 | 我一直在等你</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a18;--bg2:#121228;--accent:#9d4edd;--accent2:#7b2cbf;--gold:#c9a227;--text:#e8e8f5;--dim:#7a7a9a;--border:rgba(157,78,221,0.2);--card:rgba(255,255,255,0.04);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden;position:relative;}

/* 动态背景 */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
#touchParticles{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* 加载 */
#loader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s,visibility 1s;}
#loader.hidden{opacity:0;visibility:hidden;}
.load-ring{width:60px;height:60px;border:2px solid transparent;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
.load-ring::before{content:'';position:absolute;inset:6px;border:2px solid transparent;border-top-color:var(--gold);border-radius:50%;animation:spin 1.5s linear infinite reverse;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-text{margin-top:20px;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--accent);letter-spacing:0.3em;animation:fadePulse 2s infinite;}
@keyframes fadePulse{0%,100%{opacity:0.3}50%{opacity:1}}

/* 应用容器 */
.app{position:relative;z-index:2;max-width:520px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg)0%,var(--bg2)100%);}

/* 头部 */
.header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(10,10,24,0.85);backdrop-filter:blur(20px);flex-shrink:0;}
.header-left{display:flex;align-items:center;gap:10px;}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:breathe 2s infinite;}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.85)}}
.header-title{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:600;}
.header-sub{font-size:10px;color:var(--dim);margin-top:1px;}
.affinity-badge{padding:3px 10px;border-radius:12px;background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.25);color:var(--gold);font-size:11px;display:flex;align-items:center;gap:4px;}
.header-btns{display:flex;gap:6px;}
.hbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:all 0.3s;}
.hbtn:hover,.hbtn:active{border-color:var(--accent);color:var(--accent);transform:scale(1.08);}

/* 角色舞台 */
.stage{padding:16px 16px 8px;text-align:center;position:relative;flex-shrink:0;}
.char-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(157,78,221,0.12)0%,transparent 70%);pointer-events:none;transition:all 0.8s;}
.char-glow.happy{background:radial-gradient(circle,rgba(201,162,39,0.15)0%,transparent 70%);}
.char-glow.sad{background:radial-gradient(circle,rgba(100,100,160,0.1)0%,transparent 70%);}
.char-glow.angry{background:radial-gradient(circle,rgba(180,60,60,0.12)0%,transparent 70%);}
.char-wrap{position:relative;display:inline-block;cursor:pointer;user-select:none;-webkit-user-select:none;}
.char-wrap:active{transform:scale(0.96);}
.char-img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:3px solid rgba(157,78,221,0.35);box-shadow:0 0 30px rgba(157,78,221,0.15);transition:all 0.6s;}
.char-img.talking{box-shadow:0 0 50px rgba(157,78,221,0.4);border-color:rgba(157,78,221,0.7);}
.char-img.happy{box-shadow:0 0 45px rgba(201,162,39,0.3);border-color:rgba(201,162,39,0.5);}
.char-img.sad{box-shadow:0 0 30px rgba(100,100,160,0.2);border-color:rgba(100,100,160,0.35);filter:brightness(0.85) saturate(0.75);}
.char-img.angry{box-shadow:0 0 40px rgba(180,60,60,0.25);border-color:rgba(180,60,60,0.4);}
.char-img.blush{box-shadow:0 0 40px rgba(200,100,150,0.25);border-color:rgba(200,100,150,0.4);}

/* 动作气泡 */
.action-bubble{position:absolute;top:-8px;right:-30px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px 12px;font-size:12px;color:var(--accent);opacity:0;transform:translateY(8px);transition:all 0.4s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.4);max-width:180px;white-space:normal;text-align:left;}
.action-bubble.show{opacity:1;transform:translateY(0);}

/* 情绪标签 */
.emotion-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;}
.emotion-tag{padding:3px 12px;border-radius:20px;font-size:11px;letter-spacing:0.08em;background:var(--card);border:1px solid var(--border);color:var(--accent);transition:all 0.5s;}
.emotion-tag.happy{color:var(--gold);border-color:rgba(201,162,39,0.3);}
.emotion-tag.sad{color:#8899bb;border-color:rgba(100,100,150,0.25);}
.emotion-tag.angry{color:#cc7777;border-color:rgba(180,60,60,0.25);}
.emotion-tag.blush{color:#cc88aa;border-color:rgba(200,100,150,0.3);}

/* 互动按钮栏 */
.interact-bar{display:flex;justify-content:center;gap:8px;padding:8px 16px;flex-shrink:0;}
.ibtn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--dim);font-size:12px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:4px;}
.ibtn:hover,.ibtn:active{border-color:var(--accent);color:var(--accent);background:rgba(157,78,221,0.08);transform:translateY(-1px);}
.ibtn.gift{border-color:rgba(201,162,39,0.3);color:var(--gold);}
.ibtn.gift:hover,.ibtn.gift:active{background:rgba(201,162,39,0.1);}

/* 快捷话题 */
.topics{padding:4px 14px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.topics::-webkit-scrollbar{display:none;}
.tbtn{flex-shrink:0;padding:7px 14px;border-radius:18px;border:1px solid var(--border);background:var(--card);color:var(--dim);font-size:12px;cursor:pointer;transition:all 0.3s;}
.tbtn:hover,.tbtn:active{border-color:var(--accent);color:var(--accent);background:rgba(157,78,221,0.1);}

/* 聊天区 */
.chat{flex:1;overflow-y:auto;padding:10px 14px 100px;scroll-behavior:smooth;}
.chat::-webkit-scrollbar{width:3px;}
.chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.msg{display:flex;margin-bottom:14px;animation:msgIn 0.35s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.msg-av

# Priestess Character Archive

A fan-made character archive website for Priestess from Arknights.

## Usage

### Generate HTML
```bash
node build.js
```

### Start local server
```bash
npm install
npm run start
```

## Features
- Fully responsive for mobile browsers
- Purple theme matching Priestess character design
- Particle background animation
- Scroll fade-in effects
- Single HTML file, works offline
- Zero backend dependencies

## Requirements
- Node.js 24+
